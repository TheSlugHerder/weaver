# Nginx site configuration for Weaver (TLS)
# Replace example.com with your hostname and ensure certificates exist at the paths below.

upstream weaver_upstream {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name example.com;

    # Allow ACME challenge to pass (for certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name example.com;

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/example.com/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 127.0.0.53 valid=30s; # adjust if using systemd-resolved differently

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Proxy settings
    location / {
        proxy_pass http://weaver_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_redirect off;
        client_max_body_size 50M;
    }

    # Optional: serve health or metrics directly via Nginx
    location = /health {
        proxy_pass http://weaver_upstream/health;
    }
}

# Notes:
# - Replace `example.com` with your real domain and ensure the Let's Encrypt certs exist or point to your CA certs.
# - Allow ACME challenge directory (/var/www/html) in your filesystem and configure certbot accordingly:
#   `sudo certbot certonly --webroot -w /var/www/html -d example.com`
# - Test config: `sudo nginx -t` then reload: `sudo systemctl reload nginx`.